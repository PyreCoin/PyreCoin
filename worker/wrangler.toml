name = "pyre-rpc-proxy"
main = "src/index.js"
compatibility_date = "2026-05-09"

# Disable the workers.dev subdomain. The default subdomain exposes
# the account-holder's first name, which violates the zero-PII
# stance for this project. Traffic only enters via the custom
# domain below.
workers_dev = false
preview_urls = false

# Custom domain. Cloudflare provisions DNS + SSL automatically since
# the same account manages the pyrecoin.com zone.
routes = [
  { pattern = "rpc.pyrecoin.com", custom_domain = true }
]

# HELIUS_KEY is an encrypted secret, set via:
#   wrangler secret put HELIUS_KEY
# (don't add it here — secrets in wrangler.toml end up in plaintext
# in the deployed worker bundle).
#
# GITHUB_PAT (also a secret) drives the cron-trigger handler below.
# Set via:
#   wrangler secret put GITHUB_PAT
# Use a fine-grained PAT scoped to the PyreCoin repo with
# Actions: Read & Write only. 90-day expiration is the GitHub max —
# set a calendar reminder to rotate.

# ── INGEST CRON ───────────────────────────────────────────────────
# Fires the scheduled handler in src/index.js every 5 minutes; that
# handler POSTs to GitHub workflow_dispatch to queue an ingest run.
# Replaces the (unreliable) GH Actions schedule trigger as the
# primary cadence source. The GH cron in ingest.yml is kept as a
# best-effort backup.
[triggers]
crons = ["*/5 * * * *"]
