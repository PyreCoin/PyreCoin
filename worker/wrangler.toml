name = "pyre-rpc-proxy"
main = "src/index.js"
compatibility_date = "2026-05-09"

# Disable the workers.dev subdomain. The default subdomain exposes
# the account-holder's first name, which violates the zero-PII
# stance for this project. Traffic only enters via the custom
# domain below.
workers_dev = false
preview_urls = false

# Custom domain. Cloudflare provisions DNS + SSL automatically since
# the same account manages the pyrecoin.com zone.
routes = [
  { pattern = "rpc.pyrecoin.com", custom_domain = true }
]

# Public, non-secret config goes here in [vars]; encrypted secrets
# go through `wrangler secret put`.
[vars]
# GeckoTerminal pool address for PYRE/SOL on pump-fun. Stable for the
# life of the token. If pump.fun ever migrates the pool to PumpSwap or
# Raydium, swap this value and redeploy — no code change needed.
PYRE_POOL = "6qtLrqwJu132JtMWTRzVymZJPkczbifzN9ejq4Lg5u2P"

# Secrets (set via `wrangler secret put NAME`, then paste at the prompt
# — see CLAUDE.md §7.12; do NOT paste secret values as command args).
#
# Required for /rpc proxy + /scheduled ingest:
#   HELIUS_KEY   → Helius RPC API key (browser proxy traffic)
#   GITHUB_PAT   → fine-grained PAT, repo-scoped to PyreCoin/PyreCoin,
#                  Actions: Read & Write. 90-day max expiration —
#                  calendar a rotation reminder.
#
# Required for /analytics endpoint (CF Web Analytics → "By the Numbers"
# visitor histogram + top-countries chart). When unset, /analytics
# returns an empty payload and the frontend renders an empty-state
# placeholder — the rest of the page works fine.
#   CF_ANALYTICS_TOKEN → CF API token, scoped: Account · Account Analytics: Read
#   CF_ACCOUNT_ID      → CF account ID (zone overview right sidebar)
#   CF_SITE_TAG        → CF Web Analytics "Site tag" — same value
#                        pasted into index.html data-cf-beacon token

# ── INGEST CRON ───────────────────────────────────────────────────
# Fires the scheduled handler in src/index.js every 5 minutes; that
# handler POSTs to GitHub workflow_dispatch to queue an ingest run.
# Replaces the (unreliable) GH Actions schedule trigger as the
# primary cadence source. The GH cron in ingest.yml is kept as a
# best-effort backup.
[triggers]
crons = ["*/5 * * * *"]
